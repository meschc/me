<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- И? -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>* Личная библиотека Мещерякова К. Д. *</title>
  <base href="https://kirmesch.ru/library">
  <meta property="og:image" content="assets/img/banner3.jpeg">
  <meta property="og:url" content="https://kirmesch.ru/library">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2291FF">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!-- Заранее открываем соединение с API и подгружаем критичные шрифты -->
  <link rel="preconnect" href="https://sheets.googleapis.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="https://kirmesch.ru/assets/fonts/Minipax-Bold-BF64ab7272333c5.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="https://kirmesch.ru/assets/fonts/Minipax-SemiBold-BF64ab727206cb4.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="https://kirmesch.ru/assets/fonts/golos-text_regular.woff2" crossorigin>

  <style>
    :root {
      /* Единый акцент для всех проектов — как в index1 (--accent-color) */
      --accent: #2291FF;
      --accent-hover: #40a0ff;
      /* Единые тайминги анимаций (п.4): fast — микровзаимодействия, slow — панели/появление */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --t-fast: 0.2s;
      --t-slow: 0.4s;
    }
    @font-face {
      font-family: 'Minipax';
      src: url('https://kirmesch.ru/assets/fonts/Minipax-Bold-BF64ab7272333c5.woff2') format('woff2'),
           url('https://kirmesch.ru/assets/fonts/Minipax-Bold-BF64ab7272333c5.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Minipax';
      src: url('https://kirmesch.ru/assets/fonts/Minipax-SemiBold-BF64ab727206cb4.woff2') format('woff2'),
           url('https://kirmesch.ru/assets/fonts/Minipax-SemiBold-BF64ab727206cb4.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Golos-Regular';
      src: url('https://kirmesch.ru/assets/fonts/golos-text_regular.woff2') format('woff2'),
           url('https://kirmesch.ru/assets/fonts/golos-text_regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family:  'New York', 'PT Serif', serif, ui-serif;
      margin: 0;
      line-height: 1.24;
      gap: 2em;
      font-size: 10px;
      font-variant-numeric: lining-nums;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      background: #fff;              /* чисто белый фон всей страницы (п.3) */
    }
    a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: #3498db00;
      text-underline-offset: 0.1em;
      transition: var(--t-fast) var(--ease);
    }
    a:hover {
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--accent) 50%, transparent);
      text-underline-offset: 0.175em;
    }
    .banner {
      position: relative;
    }
    .banner img {
      height: 60vh;
      width: 100%;
      object-fit: contain;
      object-position: bottom;
    }
    .table-container {
      max-width: min(80vw, 1080px);   /* уже на больших экранах (п.7) */
      margin: 2em auto;
    }

    table { width: 100%; border-collapse: collapse; }
    .table-scrollable { display: none; /* Скрываем таблицу */ }

    .loader-text { animation: fade 1.5s ease-in-out infinite; }
    .footer {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 3em;
      font-family: 'New York', 'PT Serif', serif;   /* нижний текст — serif */
      font-size: 1.4em;
      color: #8a857c;
    }
    .footer p { margin: 0; }
    @keyframes fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ===== Подпись-заголовок со счётчиком (п.3) ===== */
    .lib-caption {
      font-family: 'Minipax', serif;
      font-weight: 600;
      font-size: clamp(1.7em, 0.6vw + 1.6em, 2.6em);
      line-height: 1.15;
      margin: 0.2em 0 0;
      color: #2b2723;
    }
    .lib-count { color: var(--accent); white-space: nowrap; font-style: italic; }

    @media (max-width: 1024px) {
      .banner img { object-fit: cover; height: 42vh; }
      .table-container {
        max-width: 100%;
        margin: 0.5em 0 2em;
        padding: 0 0.75em;
        box-sizing: border-box;
      }
    }
    @media (max-width: 600px) {
      .banner img { height: 32vh; }
    }

    /* ===== Иконки (единый стиль — feather) ===== */
    .ico {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: -0.13em;
      flex: none;
    }

    /* ===== Полка карточек: колонки равной ширины, сетка прижата ВЛЕВО, крупные промежутки ===== */
    .cards-view {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));   /* 4 колонки равной ширины (minmax(0,1fr) — иначе картинка распирает колонку) */
      justify-content: start;
      gap: 4.8em 6em;                           /* большие промежутки между книгами */
      align-items: start;                       /* обложки разной высоты — выравнивание по верху */
    }
    @media (max-width: 1120px) { .cards-view { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 820px)  { .cards-view { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    /* Переключатель «таблица / список» — только на мобайле */
    .view-toggle { display: none; }
    .view-toggle__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.6em;
      height: 2.6em;
      padding: 0;
      border: 1px solid #e2ded7;
      background: #fff;
      color: #a59f95;
      cursor: pointer;
      transition: var(--t-fast) var(--ease);
    }
    .view-toggle__btn:first-child { border-radius: 0.6em 0 0 0.6em; }
    .view-toggle__btn:last-child { border-radius: 0 0.6em 0.6em 0; margin-left: -1px; }
    .view-toggle__btn .ico { width: 1.2em; height: 1.2em; }
    .view-toggle__btn.is-active { color: var(--accent); border-color: var(--accent); z-index: 1; }

    /* Мобайл (режим «таблица»): только обложки, 3 в ряд (мельче) */
    @media (max-width: 600px)  {
      .view-toggle { display: flex; margin: 0; margin-left: auto; }   /* в одну строку с «Фильтрами», справа */
      .cards-view { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3.4em 1.6em; }
      /* В сетке: обложка 85% по центру; название и автор скрыты; показываем только book-meta по центру */
      .cards-view:not(.is-list) .book-card { align-items: center; }
      .cards-view:not(.is-list) .cover-wrap { width: 85%; }
      .cards-view:not(.is-list) .book-title,
      .cards-view:not(.is-list) .book-author { display: none; }
      .cards-view:not(.is-list) .book-content { align-items: center; }
      .cards-view:not(.is-list) .book-meta { justify-content: center; }
      .lib-main { margin-top: 1.3em; }        /* отступ между тегами и книгами */

      /* Режим «список»: строка = маленькая обложка + текст (п. «в строку») */
      .cards-view.is-list {
        display: flex;
        flex-direction: column;
        gap: 1.1em;
      }
      .cards-view.is-list .book-card { flex-direction: row; align-items: center; width: 100%; gap: 1em; }
      .cards-view.is-list .cover-wrap { width: 56px; flex: none; }
      .cards-view.is-list .book-content { display: flex; flex: 1 1 auto; min-width: 0; }
    }

    /* ===== Десктоп: фильтры в левом столбце рядом с книгами (п.8) ===== */
    .lib-body { display: block; margin-top: 1.8em; }   /* отступ от заголовка (п.1) */
    .lib-main { min-width: 0; }
    @media (min-width: 821px) {
      .lib-body { display: flex; align-items: flex-start; gap: 2em; margin-top: 2.6em; }
      .lib-sidebar {
        flex: 0 0 210px;
        align-self: flex-start;
        position: sticky;
        top: 1.2em;
        display: flex;
        flex-direction: column;
        gap: 1.1em;
      }
      .lib-main { flex: 1 1 auto; min-width: 0; }
      /* Фильтры сверху, теги-жанры снизу (п.2) */
      .lib-sidebar .filterbar { order: 0; margin: 0; flex-direction: column; align-items: stretch; gap: 0.5em; }
      .lib-sidebar .genrebar { order: 1; margin: 0; }
      .lib-sidebar .fdrop { width: 100%; }
      .lib-sidebar .fdrop__btn { width: 100%; }
      .lib-sidebar .fdrop__panel { min-width: 100%; }

    }
    .book-card {
      display: flex;
      flex-direction: column;
      align-items: stretch;        /* обложка на всю ширину колонки */
      gap: 0.7em;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;         /* 3D-сцена для наклона обложки по ховеру (как smoothui/book) */
      /* Плавное последовательное появление (п.1) */
      opacity: 0;
      transform: translateY(14px);
      transition: opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
    }
    .book-card.is-in { opacity: 1; transform: none; }

    .book-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      box-sizing: border-box;
      gap: 0.4em;
    }
    .book-title {
      font-family: 'Minipax', serif;
      font-size: 1.4em;             /* 14px (п.3) */
      font-weight: 600;
      line-height: 1.1;
      width: 100%;                  /* без резерва высоты — автор сразу под названием, без пустого отступа */
      margin: 0;
      color: #2b2723;               /* обычный цвет; цвет обложки — только по ховеру (п.6) */
      overflow-wrap: anywhere;      /* длинные слова переносятся, не вылезают за обложку (п.2) */
      transition: color var(--t-fast) var(--ease);
    }
    /* При наведении на карточку название принимает доминантный цвет обложки (п.6) */
    .book-card:hover .book-title { color: var(--cover-color, #2b2723); }
    .book-author {
      font-family: 'Golos-Regular', sans-serif;
      font-size: 1.35em;
      color: #8a857c;
      width: 100%;
      margin: 0;
    }

    /* ===== 3D-книга: тело (задняя обложка + страницы) СТОИТ НА МЕСТЕ, открывается
       только передняя обложка на петле у корешка слева (референс smoothui.dev/docs/components/book) ===== */
    .book3d {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
    }
    /* Задняя обложка — цвет обложки, во весь габарит, в глубине. СТОИТ НА МЕСТЕ (в покое скрыта лицом) */
    .book3d::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 2px 5px 5px 2px;
      background: var(--cover-color, #cfc9c0);
      transform: translateZ(-8px);
    }
    /* Белые страницы — во весь габарит лица, но на ~6px уже справа, чтобы у правого края
       при открытии выглядывал цветной кант ЗАДНЕЙ ОБЛОЖКИ. В ПОКОЕ скрыты обложкой */
    .book3d::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0; right: 6px;
      border-radius: 2px 4px 4px 2px;
      background: linear-gradient(to right, #ece8e1 0, #fdfcfa 16px);   /* тень-сгиб у корешка слева */
      box-shadow: inset -2px 0 5px rgba(0, 0, 0, 0.05);
      transform: translateZ(-3px);
    }

    /* ===== Передняя обложка (лицо книги): рамка под картинку, своей высоты, БЕЗ обрезки ===== */
    .cover-wrap {
      position: relative;
      width: 100%;
      /* Пропорция коробки известна ДО загрузки картинки: из кэша (--cover-ar) либо 2:3.
         Поэтому обложка не раздвигает полку в момент подгрузки — сетка не прыгает. */
      aspect-ratio: var(--cover-ar, 2 / 3);
      border-radius: 2px 5px 5px 2px;
      overflow: hidden;
      background: var(--cover-color, #e9e6e0);
      transform-origin: left center;                /* петля у корешка (слева) */
      transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.45s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0px 19px 11px 0px rgba(0, 0, 0, 0.04), 0px 8px 8px 0px rgba(0, 0, 0, 0.10), 0px 2px 5px 0px rgba(0, 0, 0, 0.14);
    }
    /* Ховер: открывается только передняя обложка, тело книги на месте */
    @media (hover: hover) and (pointer: fine) {
      .book-card:hover { z-index: 2; }
      .book-card:hover .cover-wrap {
        transform: rotateY(-24deg);
        box-shadow: -14px 20px 30px -16px rgba(0, 0, 0, 0.28), -5px 7px 12px -8px rgba(0, 0, 0, 0.20);
      }
    }
    /* iBooks-мокап (корешок/блик) поверх любой обложки */
    .cover-wrap::after, .sheet__cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url('/assets/img/coverMockup.svg') center / 100% 100% no-repeat;
      pointer-events: none;
      border-radius: inherit;
      z-index: 3;
    }
    /* Настоящие обложки приезжают с уже впечатанным мокапом — его накладывает
       генератор на create.kirmesch.ru. Второй слой сверху давал двойной корешок
       и лишнюю полосу среза справа, поэтому у загруженной картинки накладку снимаем.
       Сгенерированным заглушкам она по-прежнему нужна: без неё это просто плашка. */
    .cover-wrap.has-cover::after,
    .sheet__cover.has-cover::after { content: none; }
    .cover-wrap .book-cover {
      /* Вне потока: пока картинки нет, её alt не добавляет обёртке высоту.
         Раньше из-за этого под сгенерированной обложкой вылезала серая полоса
         (тем длиннее, чем длиннее название) — заметнее всего на мобильном. */
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;   /* обложка вписывается целиком, без обрезки */
      margin: 0;
      border-radius: inherit;
      opacity: 0;
      transition: opacity var(--t-slow) var(--ease);
      z-index: 1;
    }
    .cover-wrap .book-cover.is-loaded { opacity: 1; }

    /* Сгенерированная обложка-заглушка: плоский цвет + прямые линии (п.5).
       Текст сверху, графика снизу (п.4). */
    .gen-cover {
      position: absolute;          /* заполняет обёртку целиком: пропорцию задаёт .cover-wrap */
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 0.9em;
      box-sizing: border-box;
      color: #fff;
      background: var(--gc-bg, #2291FF);
      overflow: hidden;
      z-index: 0;
    }
    .gen-cover__art { position: absolute; inset: 0; width: 100%; height: 100%; }
    .gen-cover__text { position: relative; }
    .gen-cover__title {
      display: -webkit-box;
      -webkit-line-clamp: 4;         /* ограничиваем длину на обложке */
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-family: 'Minipax', serif;
      font-weight: 700;
      font-size: 1.7em;
      line-height: 1.14;   /* 1.02 обрезал выносные элементы у последней строки («д», «у», «р») */
    }
    .gen-cover__author {
      display: block;
      margin-top: 0.4em;
      font-family: 'Golos-Regular', sans-serif;
      font-size: 1.2em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Мета-строка на карточке: статус, формат, оценка, жанр ===== */
    .book-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45em 0.6em;
      width: 100%;
      margin-top: 0.1em;
      font-family: 'Golos-Regular', sans-serif;
      font-size: 1.25em;
    }
    /* все теги меты одной высоты/выравнивания (п.7) */
    .meta-status, .meta-format, .meta-rating { display: inline-flex; align-items: center; line-height: 1; height: 1.2em; }
    .book-meta .ico { width: 1.1em; height: 1.1em; }
    .meta-status.is-done { color: #2e9e57; }
    .meta-status.is-pending { color: #b9b4ab; }
    .meta-status .chk2 { margin-left: -0.5em; }
    .meta-format { color: #8a857c; }
    .meta-rating { gap: 0.18em; color: #e0a615; font-variant-numeric: tabular-nums; }
    .meta-rating .ico { fill: currentColor; }
    .meta-rating.is-fav { color: #e0245e; }
    .meta-genre {
      color: #8a857c;
      font-size: 0.92em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1 1 100%;
      min-width: 0;
    }

    /* ===== Кнопка «Где читать» — только в попапе, поиск в Яндексе (п.1) ===== */
    .sheet__search {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5em;
      width: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0.85em 1.1em;
      border-radius: 0.7em;
      background: var(--accent);
      color: #fff;
      font-family: 'Golos-Regular', sans-serif;
      font-size: 1.4em;
      line-height: 1.2;
      text-decoration: none;
      transition: filter var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
    }
    .sheet__search .ico { width: 1.15em; height: 1.15em; flex: none; }
    .sheet__search span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet__search:hover { filter: brightness(1.06); transform: translateY(-1px); text-decoration: none; }

    /* ===== Жанры — чипсами над фильтрами (п.2) ===== */
    .genrebar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
      margin: 1.4em 0 0;
      font-family: 'Golos-Regular', sans-serif;
    }
    .gchip {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      font-family: inherit;
      font-size: 1.25em;
      line-height: 1;
      height: 2.5em;               /* фикс. высота — все чипсы одинаковые */
      padding: 0 0.9em;
      box-sizing: border-box;
      border: 1px solid #e2ded7;
      background: #fff;
      border-radius: 999px;
      color: #4a463f;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--t-fast) var(--ease);
    }
    .gchip:hover { border-color: #c9c4bb; }
    .gchip.is-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .gchip__count { font-variant-numeric: tabular-nums; opacity: 0.55; font-size: 0.88em; }
    .gchip.is-active .gchip__count { opacity: 0.9; }
    .gchip--disabled { opacity: 0.4; pointer-events: none; }

    /* Обёртка «кнопка Фильтры + жанры». На десктопе прозрачна, кнопка скрыта. */
    .filters-head { display: contents; }
    .mfilter-btn { display: none; }

    /* Мобайл: «Фильтры» + переключатель вида В ОДНОЙ СТРОКЕ (filters-head), раскрытые фильтры под
       ней, теги-жанры ВНИЗУ. gap:0 у сайдбара — иначе свёрнутый filterbar раздувает отступы. */
    @media (max-width: 600px) {
      .lib-sidebar { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
      .filters-head { display: flex; align-items: center; gap: 0.6em; order: 0; }
      .filters-head .view-toggle { margin-left: auto; }
      .filterbar { order: 1; }
      .genrebar {
        order: 2;
        margin: 0.9em 0 0;
        min-width: 0;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .genrebar::-webkit-scrollbar { display: none; }
      .genrebar .gchip { flex: 0 0 auto; }
      .mfilter-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4em;
        flex: 0 0 auto;
        font-family: 'Golos-Regular', sans-serif;
        font-size: 1.25em;
        line-height: 1;
        height: 2.5em;
        padding: 0 0.9em;
        box-sizing: border-box;
        border: 1px solid #e2ded7;
        background: #fff;

    .badge {

    .rating-wrap { display: inline-flex; align-items: center; gap: 0.4em; }

    /* Пояснение — flow-блок: не обрезается, светлый фон (п.8) */

    .rating-note.is-open { max-height: 340px; opacity: 1; padding: 1em 1.1em; margin: 0 0 1.1em; }
    .rating-note b { font-size: 1.05em; margin-bottom: 0.1em; }
    .rating-note span { display: flex; align-items: center; gap: 0.4em; }
    .rating-note .ico { width: 1em; height: 1em; fill: #e0245e; color: #e0245e; }

    @media (max-width: 600px) {
      /* Мобайл: тот же модуль, но снизу */
      .sheet {
        top: auto;
        right: auto;
        left: 0;
        bottom: 0;

  </style>

  <script>
    // Конфигурация Google Sheets API — прямой REST-запрос вместо тяжёлой библиотеки gapi
    const API_KEY = 'AIzaSyDRtyU2p7NoNjW7pYu-L3eFvR3i7Pj-uRE';
    const SPREADSHEET_ID = '1G5WmOlUwzMu1CB06VHhFVKA2LGXZzzvtYwJzSk3bGtM';
    const RANGE = 'Книги!A:Z';
    const SHEETS_URL = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(RANGE)}?key=${API_KEY}`;

    // Настройки повторных попыток
    const MAX_RETRIES = 3;
    const RETRY_DELAY = 1000; // миллисекунды

    // Кэш книг переживает перезагрузку страницы: полка появляется сразу,
    // свежие данные подтягиваются в фоне (stale-while-revalidate).
    const DATA_CACHE_KEY = 'lib:books:v2';
    const DATA_TTL = 10 * 60 * 1000;   // как часто ходим в таблицу за обновлением
    let renderedSignature = '';        // отпечаток показанных данных — чтобы зря не перестраивать полку
    const loader = document.getElementById("loader");
    const footer = document.getElementById("footer");
    const cardsContainer = document.getElementById("cards-container");

    function showError(message) {
      const loader = document.getElementById("loader");
      loader.innerHTML = `<p style="color: #f44336;">${message}</p>`;
      loader.style.display = "block";
    }

    // Строки таблицы -> массив книг. Пустые строки (без названия) отбрасываем,
    // иначе на полке появляются «книги-призраки».
    function rowsToBooks(rows) {
      const headers = rows[0];
      return rows.slice(1)
        .map(row => {
          const book = {};
          headers.forEach((header, index) => { book[header] = row[index] || ''; });
          return book;
        })
        .filter(book => (book['Название'] || '').trim() !== '');
    }

    function readBooksCache() {
      try {
        const raw = localStorage.getItem(DATA_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.books) || !parsed.books.length) return null;
        return parsed;
      } catch (e) {
        return null;   // приватный режим или битый кэш — просто идём в сеть
      }
    }

    function writeBooksCache(books, signature) {
      try {
        localStorage.setItem(DATA_CACHE_KEY, JSON.stringify({ books, signature, time: Date.now() }));
      } catch (e) {
        /* нет места в хранилище — не критично, работаем без кэша */
      }
    }

    // Загрузка данных: сохранённая полка показывается мгновенно, затем тихо
    // обновляется из таблицы. Перестраиваем её только если данные реально изменились.
    async function fetchBooks(retryCount = 0) {
      const cached = readBooksCache();
      if (cached && !renderedSignature) renderBooks(cached.books, cached.signature);

      // Кэш свежий и уже на экране — в сеть не идём
      if (cached && renderedSignature && Date.now() - (cached.time || 0) < DATA_TTL) return;

      try {
        if (!renderedSignature) showLoader();
        // cache: 'no-store' — таблица должна приезжать свежей, а не из кэша браузера
        const response = await fetch(SHEETS_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const rows = data.values;
        if (!rows || !rows.length) throw new Error("Таблица вернулась пустой");

        const books = rowsToBooks(rows);
        const signature = books.length + ':' + hashStr(JSON.stringify(books));
        writeBooksCache(books, signature);
        renderBooks(books, signature);
      } catch (error) {
        console.error("Ошибка загрузки данных:", error);
        if (retryCount < MAX_RETRIES) {
          setTimeout(() => fetchBooks(retryCount + 1), RETRY_DELAY * (retryCount + 1));
        } else if (!renderedSignature) {
          // Ругаемся только если показывать нечего; иначе на экране остаётся кэш
          showError("Не удалось загрузить данные. Обновите страницу.");
        }
      } finally {
        hideLoader();
      }
    }

    function addNonBreakingSpaces(text) {
      if (!text || typeof text !== 'string') return text;
      const prepositions = [
        'в', 'без', 'до', 'из', 'к', 'на', 'по', 'о', 'от', 'перед', 'при',
        'через', 'с', 'у', 'за', 'над', 'об', 'под', 'про', 'для', 'и', 'а'
      ];
      return text.replace(
        new RegExp(`(\\s|^)(${prepositions.join('|')})(\\s)`, 'gi'),
        '$1$2&nbsp;'
      ).replace(/(\s)-(\s)/g, '&nbsp;-&nbsp;')
       .replace(/(\d+)\s(\p{L}+)/gu, '$1&nbsp;$2');
    }

    let allBooks = [];

    // Число + правильное склонение слова «книга»
    function pluralBooks(n) {
      const a = Math.abs(n) % 100, b = a % 10;
      if (a > 10 && a < 20) return 'произведений';
      if (b > 1 && b < 5) return 'произведения';
      if (b === 1) return 'произведение';
      return 'произведений';
    }

    function renderBooks(books, signature) {
      if (books.length === 0) return;
      // Фоновое обновление раз в 10 минут не должно рушить полку под пальцами:
      // если данные те же — не перестраиваем ничего.
      if (signature && signature === renderedSignature) return;
      renderedSignature = signature || '';
      allBooks = books;

      const countEl = document.getElementById('lib-count');
      if (countEl) countEl.textContent = books.length + ' ' + pluralBooks(books.length);

      renderAllCards(books); // карточки строятся ОДИН раз, обложки грузятся один раз
      buildGenreChips(books); // жанры-чипсы над фильтрами
      buildFilters(books);
      applyFilters();        // фильтры лишь показывают/прячут карточки

      footer.style.display = "flex";
    }

    // ===== Экранирование =====
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function escAttr(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ===== Иконки (feather, инлайн — единый стиль) =====
    const FEATHER = {
      'check': '<polyline points="20 6 9 17 4 12"/>',
      'check-circle': '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
      'book': '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
      'book-open': '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
      'headphones': '<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z"/><path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',
      'smartphone': '<rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
      'star': '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      'tag': '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
      'layers': '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
      'help-circle': '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      'heart': '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
      'x': '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      'chevron-down': '<polyline points="6 9 12 15 18 9"/>',
      'search': '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
      'grid': '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
      'list': '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
      'sliders': '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>'
    };
    function icon(name, cls) {
      return '<svg class="ico' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (FEATHER[name] || '') + '</svg>';
    }

    // ===== Генератор обложки-заглушки: плоский цвет + прямые линии (п.5) =====
    function hashStr(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    }
    // Плоский яркий цвет на каждую книгу (светлота умеренная — белый текст читается).
    function genBg(seed) {
      const hue = (seed * 47) % 360;
      const sat = 72 + (seed % 20);          // 72..91 %
      const lig = 36 + ((seed >>> 8) % 9);   // 36..44 % — белый текст читается на любом тоне
      return `hsl(${hue} ${sat}% ${lig}%)`;
    }
    // Графика из ПРЯМЫХ линий, разная по типу, в НИЖНЕЙ части обложки (текст сверху, п.4).
    function genArt(seed) {
      const v = seed % 5;
      const out = [];
      const line = (x1, y1, x2, y2) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
      const poly = pts => '<polygon points="' + pts + '"/>';
      if (v === 0) {                  // диагональная штриховка (снизу)
        for (let i = 0; i < 6; i++) { const o = 6 + i * 16; out.push(line(o, 84, o - 26, 148)); }
      } else if (v === 1) {           // вложенные ромбы (снизу)
        for (let i = 0; i < 3; i++) { const r = 10 + i * 11; out.push(poly('50,' + (112 - r) + ' ' + (50 + r) + ',112 50,' + (112 + r) + ' ' + (50 - r) + ',112')); }
      } else if (v === 2) {           // треугольник (снизу)
        out.push(poly('50,84 86,144 14,144'));
        out.push(line(50, 84, 50, 144));
      } else if (v === 3) {           // шевроны (снизу)
        for (let i = 0; i < 4; i++) { const y = 86 + i * 13; out.push('<polyline points="16,' + (y + 12) + ' 50,' + y + ' 84,' + (y + 12) + '"/>'); }
      } else {                        // сетка (снизу)
        for (let i = 0; i < 4; i++) { const x = 22 + i * 18; out.push(line(x, 84, x, 144)); }
        for (let i = 0; i < 3; i++) { const y = 92 + i * 16; out.push(line(12, y, 88, y)); }
      }
      return '<svg class="gen-cover__art" viewBox="0 0 100 150" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
        '<g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">' + out.join('') + '</g></svg>';
    }
    // Заглушка добавляется ВСЕГДА, даже без реальной обложки.
    function genCover(book) {
      const title = (book['Название'] || '').trim();
      const author = (book['Автор'] || '').trim();
      const seed = hashStr((title + '|' + author) || 'book');
      const el = document.createElement('div');
      el.className = 'gen-cover';
      el.style.setProperty('--gc-bg', genBg(seed));
      el.innerHTML = genArt(hashStr(title || 'book')) +
        '<div class="gen-cover__text">' +
          '<span class="gen-cover__title">' + escapeHtml(title) + '</span>' +
          (author ? '<span class="gen-cover__author">' + escapeHtml(author) + '</span>' : '') +
        '</div>';
      return el;
    }

    // ===== Помощники для мета-данных =====
    function splitList(value) {
      if (!value) return [];
      return value.split(',').map(s => s.trim()).filter(s => s && s !== '-');
    }

    const STATUS_DONE = ['Прочитано', 'Прослушано'];

    function statusMeta(status) {
      const s = (status || '').trim();
      const done = STATUS_DONE.includes(s);
      return { label: s || 'Не прочитано', done, checks: done ? 2 : 1, cls: done ? 'is-done' : 'is-pending' };
    }

    function formatMeta(format) {
      const f = (format || '');
      if (/Аудио/i.test(f)) return { icon: 'headphones', label: 'Аудио' };
      if (/Электрон/i.test(f)) return { icon: 'smartphone', label: 'Электронная' };
      if (/Бумаж/i.test(f)) return { icon: 'book-open', label: 'Бумажная' };
      return { icon: '', label: f.replace(/&nbsp;/g, ' ').trim() };
    }

    function ratingValue(rating) {
      const n = parseInt(rating, 10);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function statusHtml(book) {
      const st = statusMeta(book['Статус']);
      const one = '<span class="chk">' + icon('check') + '</span>';
      const checks = st.checks === 2 ? one + '<span class="chk chk2">' + icon('check') + '</span>' : one;
      return '<span class="meta-status ' + st.cls + '" title="' + escAttr(st.label) + '">' + checks + '</span>';
    }

    function ratingCardHtml(book) {
      const n = ratingValue(book['Оценка']);
      if (!n) return '';
      if (n >= 5) return '<span class="meta-rating is-fav" title="Любимая книга">' + icon('heart') + '</span>';
      return '<span class="meta-rating" title="Оценка ' + n + '/4">' + icon('star') + n + '</span>';
    }

    // Кнопка «?» (раскрывает пояснение) + сам блок-пояснение (flow, светлый).
    function ratingHelpBtn() {
      return '<button type="button" class="rating-help" aria-label="Система оценок">' + icon('help-circle') + '</button>';
    }
    function ratingNoteHtml() {
      return '<div class="rating-note" id="rating-note">' +
        '<b>Моя система оценки от 1 до 4</b>' +
        '<span>1 — очень скучная книга, не дочитал</span>' +
        '<span>2 — нормальная, но не зацепила, либо много воды</span>' +
        '<span>3 — хорошая книга</span>' +
        '<span>4 — отличная книга, всё в меру</span>' +
        '<span>' + icon('heart') + ' 5 — вне системы оценки: любимая книга</span>' +
      '</div>';
    }

    function ratingSheetHtml(book) {
      const n = ratingValue(book['Оценка']);
      let stars;
      if (!n) stars = '<span class="rate-stars muted">Без оценки</span>';
      else if (n >= 5) stars = '<span class="rate-stars is-fav">' + icon('heart') + ' Любимая</span>';
      else {
        let s = '';
        for (let i = 1; i <= 4; i++) s += '<span class="' + (i <= n ? 'on' : 'off') + '">' + icon('star') + '</span>';
        stars = '<span class="rate-stars">' + s + '</span>';
      }
      return '<span class="rating-wrap">' + stars + ratingHelpBtn() + '</span>';
    }

    function buildMetaHtml(book) {
      const fmt = formatMeta(book['Формат']);
      let html = statusHtml(book);
      if (fmt.icon) html += '<span class="meta-format" title="' + escAttr(fmt.label) + '">' + icon(fmt.icon) + '</span>';
      html += ratingCardHtml(book);
      return html;   // теги жанров с карточки убраны
    }

    // Одна кнопка «Где читать» — только в попапе. Переброс в Яндекс-поиск по названию+автору (п.1).
    function searchLinkHtml(book) {
      const title = (book['Название'] || '').trim();
      if (!title) return '';
      const author = (book['Автор'] || '').trim();
      const query = (title + (author ? ' ' + author : '') + ' читать').trim();
      const url = 'https://yandex.ru/search/?text=' + encodeURIComponent(query);
      return '<a class="sheet__search" href="' + escAttr(url) + '" target="_blank" rel="noopener">' +
        icon('search') + '<span>Где читать «' + escapeHtml(title) + '»</span></a>';
    }

    // ===== Полка карточек: строим ОДИН раз, обложки грузятся один раз =====
    let cardRecords = []; // [{ el, book }]

    function renderAllCards(books) {
      cardsContainer.innerHTML = "";
      cardRecords = [];

      const template = document.getElementById('book-card-template');
      const fragment = document.createDocumentFragment();

      books.forEach(book => {
        const node = template.content.cloneNode(true);
        const cardEl = node.querySelector('.book-card');
        const coverWrap = node.querySelector('.cover-wrap');
        const cardCover = node.querySelector('.book-cover');
        const titleText = node.querySelector('.book-title');
        const authorText = node.querySelector('.book-author');
        const metaEl = node.querySelector('.book-meta');

        titleText.innerHTML = addNonBreakingSpaces(book["Название"]) || " ";
        authorText.innerHTML = addNonBreakingSpaces(book["Автор"]) || " ";
        cardCover.alt = book["Название"] || "";
        metaEl.innerHTML = buildMetaHtml(book);

        // Заглушка-сайзер задаёт ширину обёртки (под ней потом проявится обложка)
        coverWrap.prepend(genCover(book));

        cardEl.dataset.cover = book["Обложка"] || "";
        applyCoverMeta(cardEl, cardEl.dataset.cover);   // пропорция и цвет из кэша — до загрузки
        cardEl.addEventListener('click', () => openSheet(book));

        cardRecords.push({ el: cardEl, book });
        fragment.appendChild(node);
      });

      cardsContainer.appendChild(fragment);

      const nr = document.createElement('p');
      nr.className = 'no-results';
      nr.id = 'no-results';
      nr.hidden = true;
      nr.textContent = 'Ничего не найдено по выбранным фильтрам.';
      cardsContainer.appendChild(nr);

      observeCovers();

      // Плавное последовательное появление (п.1).
      // rAF троттлится в фоновой вкладке — дублируем setTimeout-ом, чтобы карточки точно проявились.
      cardRecords.forEach((r, i) => { r.el.style.transitionDelay = (Math.min(i, 24) * 0.035) + 's'; });
      const reveal = () => cardRecords.forEach(r => r.el.classList.add('is-in'));
      requestAnimationFrame(() => requestAnimationFrame(reveal));
      setTimeout(reveal, 60);
    }

    // Ленивая загрузка обложек через IntersectionObserver.
    // Раньше на каждый кадр скролла обходились ВСЕ карточки с getBoundingClientRect —
    // это дёргало layout и давало рывки при прокрутке. Наблюдатель считает всё сам,
    // и он же сам подхватывает карточки, которые вернули фильтры.
    let coverObserver = null;
    const PRIMED_COVERS = 8;   // сколько обложек грузим сами, если вкладка открыта в фоне

    function observeCovers() {
      if (!('IntersectionObserver' in window)) {
        cardRecords.forEach(r => { if (r.el.dataset.cover) loadCover(r.el); });
        return;
      }
      // Полка пересобирается целиком, поэтому сначала отпускаем старые карточки:
      // иначе наблюдатель продолжает держать удалённые узлы.
      if (coverObserver) coverObserver.disconnect();
      if (!coverObserver) {
        coverObserver = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            obs.unobserve(entry.target);          // каждая обложка грузится один раз
            loadCover(entry.target);
          });
        }, { rootMargin: '600px 0px' });          // берём с запасом на экран вперёд
      }
      cardRecords.forEach(r => { if (r.el.dataset.cover) coverObserver.observe(r.el); });

      // В фоновой вкладке браузер не вызывает наблюдателя. Обложки первого экрана
      // начинаем грузить сами, чтобы при возврате на вкладку полка была уже готова.
      if (document.hidden) {
        cardRecords.slice(0, PRIMED_COVERS).forEach(r => {
          if (!r.el.dataset.cover) return;
          coverObserver.unobserve(r.el);
          loadCover(r.el);
        });
      }
    }

    // Безопасный (читаемый на белом) доминантный цвет обложки.
    function safeColorFromImage(img) {
      const c = document.createElement('canvas');
      c.width = 40; c.height = 60;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 40, 60);
      const d = ctx.getImageData(0, 0, 40, 60).data;
      let r = 0, g = 0, b = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) {
        const br = (d[i] + d[i + 1] + d[i + 2]) / 3;
        if (br > 25 && br < 230) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
      }
      if (!n) return null;
      r /= n; g /= n; b /= n;
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      const f = lum > 0.5 ? 0.55 : 0.78;
      return `rgb(${Math.round(r * f)}, ${Math.round(g * f)}, ${Math.round(b * f)})`;
    }

    const coverColorCache = new Map();

    // ===== Кэш обложек: пропорция и доминантный цвет =====
    // Пропорция нужна ДО загрузки картинки — тогда на повторных заходах карточка
    // сразу встаёт нужного размера и полка при скролле не прыгает.
    const COVER_CACHE_KEY = 'lib:covers:v1';
    const COVER_SAVE_DELAY = 400;   // обложки грузятся пачкой — пишем кэш один раз, а не 57
    const COVER_FADE_MS = 450;      // чуть длиннее --t-slow: заглушка держится до конца проявления
    const coverMeta = readCoverMeta();
    let coverMetaDirty = false;
    let coverSaveTimer = 0;

    function readCoverMeta() {
      try {
        const raw = localStorage.getItem(COVER_CACHE_KEY);
        const parsed = raw ? JSON.parse(raw) : null;
        return (parsed && typeof parsed === 'object') ? parsed : {};
      } catch (e) {
        return {};   // приватный режим или битый кэш — работаем без него
      }
    }
    function flushCoverMeta() {
      if (!coverMetaDirty) return;
      coverMetaDirty = false;
      try { localStorage.setItem(COVER_CACHE_KEY, JSON.stringify(coverMeta)); }
      catch (e) { /* нет места — не критично */ }
    }
    function saveCoverMeta() {
      if (!coverMetaDirty) return;
      clearTimeout(coverSaveTimer);
      coverSaveTimer = setTimeout(flushCoverMeta, COVER_SAVE_DELAY);
    }
    // Уход со страницы не должен съедать последнюю пачку обложек
    window.addEventListener('pagehide', flushCoverMeta);
    function rememberCover(url, ar, color) {
      const prev = coverMeta[url] || {};
      const next = { ar: ar || prev.ar || '', color: color || prev.color || '' };
      if (prev.ar === next.ar && prev.color === next.color) return;
      coverMeta[url] = next;
      coverMetaDirty = true;
    }
    // Известные пропорцию и цвет ставим на карточку заранее, ещё до сети.
    function applyCoverMeta(card, url) {
      const m = coverMeta[url];
      if (!m) return;
      if (m.ar) card.style.setProperty('--cover-ar', m.ar);
      if (m.color) card.style.setProperty('--cover-color', m.color);
    }

    // Тяжёлый расчёт цвета — в простое, чтобы не тормозить показ обложки.
    const whenIdle = window.requestIdleCallback
      ? cb => window.requestIdleCallback(cb, { timeout: 1500 })
      : cb => setTimeout(cb, 250);

    function extractColor(img, url) {
      if (coverColorCache.has(url)) return coverColorCache.get(url);
      let col = null;
      try {
        col = safeColorFromImage(img);
      } catch (e) {
        col = null;   // canvas «испорчен» без CORS — цвет не берём и больше не пробуем
      }
      coverColorCache.set(url, col);
      return col;
    }

    // Ленивая подгрузка обложки: пропорция карточки = пропорция картинки (не обрезается),
    // цвет обложки идёт в --cover-color (поля-letterbox и название по ховеру, п.6).
    function loadCover(card, attempt) {
      const url = card.dataset.cover;
      if (!url) return;
      const step = attempt || 0;
      const wrap = card.querySelector('.cover-wrap');
      const img = card.querySelector('.book-cover');

      // crossOrigin нужен только чтобы прочитать цвет с canvas. Если хост не отдаёт
      // CORS-заголовки, первая попытка падает — вторая идёт без него, и обложка
      // всё равно показывается (просто без цвета).
      if (step === 0) img.crossOrigin = 'anonymous';
      else img.removeAttribute('crossorigin');

      img.onload = function () {
        const ar = (this.naturalWidth && this.naturalHeight)
          ? this.naturalWidth + ' / ' + this.naturalHeight
          : '';
        if (ar) card.style.setProperty('--cover-ar', ar);
        img.classList.add('is-loaded');
        wrap.classList.add('has-cover');   // мокап уже внутри файла — свой не рисуем
        // Заглушка лежит ПОД картинкой и убирается лишь когда та полностью проявилась,
        // иначе в момент перехода видна серая подложка обёртки.
        const gc = wrap.querySelector('.gen-cover');
        if (gc) setTimeout(() => gc.remove(), COVER_FADE_MS);
        rememberCover(url, ar, '');

        whenIdle(() => {
          const col = extractColor(img, url);
          if (col) {
            card.style.setProperty('--cover-color', col);
            rememberCover(url, ar, col);
          }
          saveCoverMeta();
        });
      };
      img.onerror = function () {
        if (step === 0) { img.removeAttribute('src'); loadCover(card, 1); return; }
        /* обложки нет — остаётся заглушка */
      };
      img.src = url;
    }

    // ===== Фильтры: жанры-чипсы (п.2) + дропдауны + ползунок оценки (п.3); само-фасетинг (п.5) =====
    const FACETS = [
      { key: 'Статус', label: 'Статус', ui: 'dropdown', ic: 'check-circle',
        values: b => { const s = (b['Статус'] || '').trim(); return [s || 'Не прочитано']; },
        render: v => icon(STATUS_DONE.includes(v) ? 'check-circle' : 'book') + ' ' + escapeHtml(v) },
      { key: 'Жанр',   label: 'Жанр',   ui: 'chips', ic: 'book', values: b => splitList(b['Жанр']) },
      { key: 'Оценка', label: 'Оценка', ui: 'dropdown', ic: 'star',
        values: b => { const n = ratingValue(b['Оценка']); return [n ? String(n) : '0']; },
        render: v => v === '0' ? 'Без оценки' : (v === '5' ? icon('heart') + ' Любимая' : icon('star') + ' ' + v) },
      { key: 'Метки',  label: 'Метки',  ui: 'dropdown', ic: 'tag', values: b => splitList(b['Метки']),
        render: v => icon('tag') + ' ' + escapeHtml(v) },
      { key: 'Формат', label: 'Формат', ui: 'dropdown', ic: 'layers', values: b => { const f = formatMeta(b['Формат']); return f.label ? [f.label] : []; },
        render: v => { const m = { 'Аудио': 'headphones', 'Электронная': 'smartphone', 'Бумажная': 'book-open' }; return (m[v] ? icon(m[v]) + ' ' : '') + escapeHtml(v); } }
    ];

    const activeFilters = {};                 // key -> Set (жанры-чипсы + дропдауны)
    FACETS.forEach(f => { activeFilters[f.key] = new Set(); });

    // Проходит ли книга все фильтры, КРОМЕ exceptKey (для само-фасетинга).
    function matchBook(book, exceptKey) {
      for (const facet of FACETS) {
        if (facet.key === exceptKey) continue;
        const sel = activeFilters[facet.key];
        if (sel.size && !facet.values(book).some(v => sel.has(v))) return false;
      }
      return true;
    }
    function bookMatchesFilters(book) { return matchBook(book, null); }
    function booksMatching(excludeKey) { return allBooks.filter(b => matchBook(b, excludeKey)); }

    function facetCounts(facet) {
      const counts = new Map();
      booksMatching(facet.key).forEach(b => facet.values(b).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)));
      return counts;
    }

    function sortEntries(facet, entries) {
      if (facet.key === 'Оценка') {
        const num = v => v === '0' ? -1 : +v;
        return entries.sort((a, b) => num(b[0]) - num(a[0]));
      }
      return entries.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ru'));
    }

    function anyFilterActive() {
      return FACETS.some(f => activeFilters[f.key].size);
    }

    function applyFilters() {
      let visible = 0;
      cardRecords.forEach(r => {
        const show = bookMatchesFilters(r.book);
        r.el.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      const nr = document.getElementById('no-results');
      if (nr) nr.hidden = visible !== 0;
      refreshGenreChips();
      refreshDropdowns();
      const reset = document.getElementById('filterbar-reset');
      if (reset) reset.hidden = !anyFilterActive();
      updateMobileFilterBtn();
      // обложки у показанных карточек подхватит IntersectionObserver
    }

    // --- Жанры-чипсы ---
    const GENRE_FACET = FACETS.find(f => f.key === 'Жанр');
    function buildGenreChips(books) {
      const bar = document.getElementById('genrebar');
      if (!bar) return;
      bar.innerHTML = '';
      const all = new Map();
      books.forEach(b => GENRE_FACET.values(b).forEach(g => all.set(g, (all.get(g) || 0) + 1)));
      if (!all.size) { bar.style.display = 'none'; return; }
      bar.style.display = 'flex';
      [...all.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ru')).forEach(([g]) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'gchip';
        chip.dataset.genre = g;
        chip.innerHTML = '<span class="gchip__txt">' + escapeHtml(g) + '</span><span class="gchip__count"></span>';
        chip.addEventListener('click', () => {
          const s = activeFilters['Жанр'];
          if (s.has(g)) s.delete(g); else s.add(g);
          applyFilters();
        });
        bar.appendChild(chip);
      });
    }
    function refreshGenreChips() {
      const counts = facetCounts(GENRE_FACET);
      const sel = activeFilters['Жанр'];
      const bar = document.getElementById('genrebar');
      if (!bar) return;
      const chips = [...bar.querySelectorAll('.gchip')];
      chips.forEach(chip => {
        const g = chip.dataset.genre;
        const c = counts.get(g) || 0;
        chip.classList.toggle('is-active', sel.has(g));
        chip.classList.toggle('gchip--disabled', c === 0 && !sel.has(g));
        chip.querySelector('.gchip__count').textContent = c;
      });
      // Активные жанры — в начало списка (п.6)
      chips.sort((a, b) => {
        const aA = sel.has(a.dataset.genre) ? 1 : 0;
        const bA = sel.has(b.dataset.genre) ? 1 : 0;
        if (aA !== bA) return bA - aA;
        const ca = counts.get(a.dataset.genre) || 0;
        const cb = counts.get(b.dataset.genre) || 0;
        return cb - ca || a.dataset.genre.localeCompare(b.dataset.genre, 'ru');
      });
      chips.forEach(chip => bar.appendChild(chip));
    }

    // --- Дропдауны (Статус/Метки/Формат) + ползунок оценки ---
    function buildFilters(books) {
      const bar = document.getElementById('filterbar');
      if (!bar) return;
      bar.innerHTML = '';

      FACETS.filter(f => f.ui === 'dropdown').forEach(facet => {
        const all = new Map();
        books.forEach(b => facet.values(b).forEach(v => all.set(v, (all.get(v) || 0) + 1)));
        if (!all.size) return;

        const drop = document.createElement('div');
        drop.className = 'fdrop';
        drop.dataset.key = facet.key;
        drop.innerHTML =
          '<button type="button" class="fdrop__btn">' +
            icon(facet.ic, 'fdrop__icn') +
            '<span class="fdrop__label">' + escapeHtml(facet.label) + '</span>' +
            '<span class="fdrop__badge"></span>' +
            icon('chevron-down', 'fdrop__chev') +
          '</button>' +
          '<div class="fdrop__panel"></div>';

        const panel = drop.querySelector('.fdrop__panel');
        sortEntries(facet, [...all.entries()]).forEach(entry => {
          const value = entry[0];
          const opt = document.createElement('label');
          opt.className = 'fopt';
          opt.dataset.value = value;
          opt.innerHTML =
            '<input type="checkbox">' +
            '<span class="fopt__txt">' + (facet.render ? facet.render(value) : escapeHtml(value)) + '</span>' +
            '<span class="fopt__count"></span>';
          opt.querySelector('input').addEventListener('change', () => toggleFilter(facet.key, value));
          panel.appendChild(opt);
        });

        drop.querySelector('.fdrop__btn').addEventListener('click', e => { e.stopPropagation(); toggleDrop(drop); });
        panel.addEventListener('click', e => e.stopPropagation());
        bar.appendChild(drop);
      });

      const reset = document.createElement('button');
      reset.type = 'button';
      reset.className = 'filterbar__reset';
      reset.id = 'filterbar-reset';
      reset.textContent = 'Сбросить фильтры';
      reset.hidden = true;
      reset.addEventListener('click', () => {
        FACETS.forEach(f => activeFilters[f.key].clear());
        applyFilters();
      });
      bar.appendChild(reset);
    }

    function refreshDropdowns() {
      document.querySelectorAll('#filterbar .fdrop').forEach(drop => {
        const facet = FACETS.find(f => f.key === drop.dataset.key);
        if (!facet) return;
        const counts = facetCounts(facet);
        const sel = activeFilters[facet.key];

        drop.classList.toggle('is-active', sel.size > 0);
        drop.querySelector('.fdrop__badge').textContent = sel.size ? sel.size : '';

        drop.querySelectorAll('.fopt').forEach(opt => {
          const v = opt.dataset.value;
          const c = counts.get(v) || 0;
          opt.querySelector('.fopt__count').textContent = c;
          opt.classList.toggle('fopt--disabled', c === 0 && !sel.has(v));
          opt.querySelector('input').checked = sel.has(v);
        });
      });
    }

    function toggleFilter(key, value) {
      const set = activeFilters[key];
      if (set.has(value)) set.delete(value); else set.add(value);
      applyFilters();
    }

    function toggleDrop(drop) {
      const open = drop.classList.contains('is-open');
      closeAllDrops();
      if (!open) drop.classList.add('is-open');
    }
    function closeAllDrops() {
      document.querySelectorAll('#filterbar .fdrop.is-open').forEach(d => d.classList.remove('is-open'));
    }
    document.addEventListener('click', closeAllDrops);

    // Мобильная кнопка «Фильтры» — прячет все дропдауны за собой (п.4)
    const mfilterBtn = document.getElementById('mfilter-btn');
    if (mfilterBtn) {
      mfilterBtn.innerHTML = icon('sliders') + 'Фильтры<span class="mfilter-btn__badge" id="mfilter-badge"></span>';
      mfilterBtn.addEventListener('click', e => {
        e.stopPropagation();
        const bar = document.getElementById('filterbar');
        const open = bar.classList.toggle('is-open');
        mfilterBtn.setAttribute('aria-expanded', String(open));
        // overflow:visible ставим ПОСЛЕ анимации — чтобы панели дропдаунов не обрезались,
        // но само раскрытие оставалось плавным (п.1)
        if (open) {
          bar.addEventListener('transitionend', function te(ev) {
            if (ev.propertyName === 'max-height') { bar.style.overflow = 'visible'; bar.removeEventListener('transitionend', te); }
          });
        } else {
          bar.style.overflow = '';
          closeAllDrops();
        }
      });
    }
    function updateMobileFilterBtn() {
      const mb = document.getElementById('mfilter-btn');
      if (!mb) return;
      const n = FACETS.filter(f => f.ui === 'dropdown').reduce((s, f) => s + activeFilters[f.key].size, 0);
      mb.classList.toggle('is-active', n > 0);
      const badge = document.getElementById('mfilter-badge');
      if (badge) badge.textContent = n || '';
    }

    // ===== Переключатель вида «таблица / список» (мобайл) =====
    (function initViewToggle() {
      const toggle = document.getElementById('view-toggle');
      if (!toggle) return;
      const gridBtn = toggle.querySelector('[data-view="grid"]');
      const listBtn = toggle.querySelector('[data-view="list"]');
      gridBtn.innerHTML = icon('grid');
      listBtn.innerHTML = icon('list');
      toggle.addEventListener('click', e => {
        const btn = e.target.closest('.view-toggle__btn');
        if (!btn) return;
        const list = btn.dataset.view === 'list';
        cardsContainer.classList.toggle('is-list', list);
        gridBtn.classList.toggle('is-active', !list);
        listBtn.classList.toggle('is-active', list);
      });
    })();

    // ===== Детали книги: боковая панель (drawer) =====
    const sheetOverlay = document.getElementById('sheet-overlay');
    const sheetBody = document.getElementById('sheet-body');
    const sheetFooter = document.getElementById('sheet-footer');
    const sheetCloseBtn = document.getElementById('sheet-close');
    sheetCloseBtn.innerHTML = icon('x');

    function cleanVal(v) {
      const s = (v || '').replace(/&nbsp;/g, ' ').trim();
      return (!s || s === '-') ? '' : s;
    }

    // Не выводим отдельной строкой: показано выше, служебное, или вынесено в конец (Рецензия).
    const SHEET_SKIP = new Set(['№', 'Название', 'Автор', 'Статус', 'Оценка', 'Формат', '//Обложка', 'Обложка', '//Логлайн', '//Рецензия', 'Ссылка на ЧГ', 'Ссылка на Литрес']);

    function pluralChar(n) {
      const a = n % 100, b = a % 10;
      if (a > 10 && a < 20) return 'характеристик';
      if (b > 1 && b < 5) return 'характеристики';
      if (b === 1) return 'характеристика';
      return 'характеристик';
    }

    // № в библиотеке + остальные колонки (п.9). Если строк больше 5 — лишние под раскрытие (п.3).
    function rowsHtml(book) {
      const rows = [];
      const num = cleanVal(book['№']);
      if (num) rows.push(['№', num]);
      Object.keys(book)
        .filter(k => !SHEET_SKIP.has(k) && !/^Column\s*\d+$/i.test(k))
        .forEach(k => { const v = cleanVal(book[k]); if (v) rows.push([k.replace(/^\/\/\s*/, ''), v]); });
      if (!rows.length) return '';

      const LIMIT = 5;
      const rowStr = (r, i) => {
        const ex = i >= LIMIT ? ' is-extra' : '';
        return '<dt class="sheet__dt' + ex + '">' + escapeHtml(r[0]) + '</dt>' +
               '<dd class="sheet__dd' + ex + '">' + escapeHtml(r[1]) + '</dd>';
      };
      // Все строки в ОДНОМ grid — колонки ровные между видимыми и скрытыми (п.2)
      const dl = '<dl class="sheet__rows' + (rows.length > LIMIT ? ' is-collapsed' : '') + '">' +
        rows.map(rowStr).join('') + '</dl>';
      if (rows.length <= LIMIT) return dl;
      const more = rows.length - LIMIT;
      const label = 'Ещё ' + more + ' ' + pluralChar(more);
      return dl +
        '<button type="button" class="sheet__more-btn" aria-expanded="false">' +
          icon('chevron-down', 'sheet__more-chev') +
          '<span class="sheet__more-txt" data-more="' + escAttr(label) + '" data-less="Скрыть">' + escapeHtml(label) + '</span>' +
        '</button>';
    }

    // Высота свёрнутого списка характеристик = позиция первой скрытой строки (п.4)
    function collapsedRowsHeight(dl) {
      const fe = dl.querySelector('.is-extra');
      if (!fe) return dl.scrollHeight;
      return Math.round(fe.getBoundingClientRect().top - dl.getBoundingClientRect().top);
    }
    function initRowsCollapse() {
      const dl = sheetBody.querySelector('.sheet__rows.is-collapsed');
      if (dl) dl.style.maxHeight = collapsedRowsHeight(dl) + 'px';
    }

    // Рецензия — отдельным блоком в самом конце (п.10).
    function reviewHtml(book) {
      const r = cleanVal(book['//Рецензия']);
      if (!r) return '';
      return '<div class="sheet__review"><h3>Рецензия</h3><p>' + escapeHtml(r) + '</p></div>';
    }

    let noteOpen = false;

    function openSheet(book) {
      const fmt = formatMeta(book['Формат']);
      const st = statusMeta(book['Статус']);
      const logline = cleanVal(book['//Логлайн']);
      const search = searchLinkHtml(book);
      noteOpen = false;

      // Обложка: заглушка сразу, реальная — поверх по загрузке (фикс. высота, ширина любая)
      const cover = document.createElement('div');
      cover.className = 'sheet__cover';
      cover.appendChild(genCover(book));
      const url = cleanVal(book['Обложка']);
      if (url) {
        // crossOrigin такой же, как у карточки: иначе браузер считает это другим
        // запросом и качает ту же обложку второй раз вместо того, чтобы взять из кэша.
        const show = withCors => {
          const img = new Image();
          img.className = 'sheet__cover-img';
          img.alt = book['Название'] || '';
          img.decoding = 'async';
          if (withCors) img.crossOrigin = 'anonymous';
          img.onload = () => {
            cover.innerHTML = '';
            cover.appendChild(img);
            cover.classList.add('has-cover');
          };
          if (withCors) img.onerror = () => show(false);   // хост без CORS — грузим как обычно
          img.src = url;
        };
        show(true);
      }

      const info = document.createElement('div');
      info.className = 'sheet__info';
      info.innerHTML =
        '<h2 class="sheet__title" id="sheet-title">' + escapeHtml(book['Название'] || '') + '</h2>' +
        (book['Автор'] ? '<p class="sheet__author">' + escapeHtml(book['Автор']) + '</p>' : '') +
        '<div class="sheet__badges">' +
          '<span class="badge' + (st.done ? ' badge-done' : '') + '">' + statusHtml(book) + escapeHtml(st.label) + '</span>' +
          (fmt.icon ? '<span class="badge">' + icon(fmt.icon) + escapeHtml(fmt.label) + '</span>' : '') +
          '<span class="badge">' + ratingSheetHtml(book) + '</span>' +
        '</div>' +
        ratingNoteHtml() +
        (logline ? '<p class="sheet__logline">' + escapeHtml(logline) + '</p>' : '') +
        rowsHtml(book) +
        reviewHtml(book);

      sheetBody.innerHTML = '';
      sheetBody.appendChild(cover);
      sheetBody.appendChild(info);
      sheetBody.scrollTop = 0;
      sheetFooter.innerHTML = search;   // кнопка «Где читать» — в закреплённом футере
      initRowsCollapse();

      sheetOverlay.classList.add('is-open');
      sheetOverlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      sheetOverlay.classList.remove('is-open');
      sheetOverlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function setNote(open) {
      const note = sheetBody.querySelector('.rating-note');
      if (note) note.classList.toggle('is-open', open);
    }

    sheetCloseBtn.addEventListener('click', closeSheet);
    sheetOverlay.addEventListener('click', e => { if (e.target === sheetOverlay) closeSheet(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOverlay.classList.contains('is-open')) closeSheet(); });

    // Мобайл: закрытие свайпом вниз (стандартный жест iOS, п.2)
    const sheetEl = document.querySelector('.sheet');
    let dragStartY = null, dragging = false, dragDelta = 0;
    sheetEl.addEventListener('touchstart', e => {
      if (window.innerWidth > 600) return;
      if (sheetBody.scrollTop > 2) return;          // тянем только когда список прокручен вверх
      dragStartY = e.touches[0].clientY; dragging = true; dragDelta = 0;
      sheetEl.style.transition = 'none';
    }, { passive: true });
    sheetEl.addEventListener('touchmove', e => {
      if (!dragging) return;
      dragDelta = e.touches[0].clientY - dragStartY;
      if (dragDelta < 0) dragDelta = 0;
      sheetEl.style.transform = 'translateY(' + dragDelta + 'px)';
    }, { passive: true });
    function endSheetDrag() {
      if (!dragging) return;
      dragging = false;
      sheetEl.style.transition = '';
      sheetEl.style.transform = '';
      if (dragDelta > 110) closeSheet();
      dragDelta = 0;
    }
    sheetEl.addEventListener('touchend', endSheetDrag);
    sheetEl.addEventListener('touchcancel', endSheetDrag);

    // Пояснение оценки: наведение (десктоп) + тап (тач)
    sheetBody.addEventListener('mouseover', e => { if (e.target.closest('.rating-help')) setNote(true); });
    sheetBody.addEventListener('mouseout', e => {
      const h = e.target.closest('.rating-help');
      if (h && !h.contains(e.relatedTarget) && !noteOpen) setNote(false);
    });
    sheetBody.addEventListener('click', e => {
      if (e.target.closest('.rating-help')) { e.stopPropagation(); noteOpen = !noteOpen; setNote(noteOpen); }
    });

    // Раскрыть/скрыть лишние характеристики (п.4): плавно по высоте, текст → «Скрыть»
    sheetBody.addEventListener('click', e => {
      const btn = e.target.closest('.sheet__more-btn');
      if (!btn) return;
      const dl = sheetBody.querySelector('.sheet__rows');
      if (!dl) return;
      const txt = btn.querySelector('.sheet__more-txt');
      const collapsing = !dl.classList.contains('is-collapsed');
      if (collapsing) {
        dl.style.maxHeight = dl.scrollHeight + 'px';   // фиксируем текущую высоту
        dl.classList.add('is-collapsed');
        requestAnimationFrame(() => { dl.style.maxHeight = collapsedRowsHeight(dl) + 'px'; });
        btn.setAttribute('aria-expanded', 'false');
        if (txt) txt.textContent = txt.dataset.more;
      } else {
        dl.classList.remove('is-collapsed');
        dl.style.maxHeight = dl.scrollHeight + 'px';
        btn.setAttribute('aria-expanded', 'true');
        if (txt) txt.textContent = txt.dataset.less;
      }
    });

    function showLoader() { loader.style.display = "block"; }
    function hideLoader() { loader.style.display = "none"; }

    // Стартуем загрузку сразу — DOM уже готов (скрипт в конце body)
    fetchBooks();
    // Тихое автообновление данных раз в 10 минут
    setInterval(fetchBooks, 600000);
  </script>
</body>
</html>
